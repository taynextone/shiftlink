events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Docker's embedded DNS keeps the app target fresh when Compose recreates
    # the container. A static upstream would keep the old IP and return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        set $app_upstream http://app:3000;

        # Serve built SPA assets directly from nginx (correct MIME, caching, no proxy overhead)
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check bypass rate limit
        location = /api/v1/health {
            proxy_pass $app_upstream;
            access_log off;
        }

        # API calls go to the Node app
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ACME for certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
